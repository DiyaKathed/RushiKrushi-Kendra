<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F0"/>
      <stop offset="100%" stop-color="#EAF2E3"/>
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#438A35"/>
      <stop offset="100%" stop-color="#245C2A"/>
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2C94C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FAF8F0" stop-opacity="0"/>
    </radialGradient>

    <!-- Soil Gradient -->
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80552F"/>
      <stop offset="100%" stop-color="#5C3B1E"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle Contour / Furrow Field Lines -->
  <path d="M0,450 Q200,420 400,450 T800,450 L800,600 L0,600 Z" fill="#E2EDDA" opacity="0.6"/>
  <path d="M0,490 Q200,470 400,490 T800,490 L800,600 L0,600 Z" fill="#D7E4CE" opacity="0.7"/>

  <!-- Sun Circle in Background -->
  <circle cx="400" cy="240" r="130" fill="url(#sunGlow)"/>
  <circle cx="400" cy="240" r="60" fill="#F2C94C" opacity="0.25"/>

  <!-- Fertile Soil Mound -->
  <ellipse cx="400" cy="400" rx="90" ry="22" fill="url(#soilGrad)"/>
  <ellipse cx="400" cy="397" rx="75" ry="15" fill="#99683B" opacity="0.5"/>

  <!-- Central Sprout / Plant Vector -->
  <!-- Stem -->
  <path d="M400,390 C400,320 398,240 400,200" stroke="#245C2A" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Left Leaf -->
  <path d="M400,310 C340,300 290,240 300,190 C340,200 390,260 400,310 Z" fill="url(#leafGrad)"/>
  <path d="M400,310 C350,270 320,220 300,190" stroke="#FAF8F0" stroke-width="2.5" stroke-linecap="round" opacity="0.6" fill="none"/>

  <!-- Right Leaf -->
  <path d="M400,270 C460,250 505,195 490,150 C450,165 410,225 400,270 Z" fill="#438A35"/>
  <path d="M400,270 C445,230 475,185 490,150" stroke="#FAF8F0" stroke-width="2.5" stroke-linecap="round" opacity="0.6" fill="none"/>

  <!-- Top Sprout Leaves -->
  <path d="M400,205 C380,180 375,150 385,130 C400,150 405,180 400,205 Z" fill="#5BA64B"/>
  <path d="M400,205 C420,180 425,150 415,130 C400,150 395,180 400,205 Z" fill="#438A35"/>

  <!-- Small Dewdrop on Left Leaf -->
  <circle cx="340" cy="225" r="4.5" fill="#FAF8F0" opacity="0.8"/>

  <!-- Store Brand Label Badge -->
  <g transform="translate(400, 475)">
    <!-- Badge Background -->
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#FFFFFF" stroke="#D7E1D1" stroke-width="1.5" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.04))"/>
    
    <!-- Mini Leaf Icon in Badge -->
    <path d="M-160,0 C-168,-8 -175,0 -168,8 C-160,8 -156,0 -160,0 Z" fill="#245C2A"/>
    
    <!-- English & Marathi Text -->
    <text x="-140" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#245C2A" letter-spacing="0.5">
      RUSHI KRUSHI SEVA KENDRA
    </text>
  </g>

  <!-- Secondary Subtext / Fallback Tag -->
  <text x="400" y="525" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#5D685B" letter-spacing="0.3">
    ऋषी कृषी सेवा केंद्र • शेती सल्ला व कृषी निविष्ठा
  </text>
</svg>
